name: Henge
options:
  bundleIdPrefix: com.henge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # The app and its JIT helper follow this together (the helper's id sits under the app's).
    HENGE_BUNDLE_IDENTIFIER: com.henge.a13.monterey
    # The app's entitlements file. Override on the xcodebuild command line (the JIT helper doesn't use it, so a
    # personal team can sign the app with fewer entitlements without touching the helper).
    HENGE_ENTITLEMENTS: Henge/Henge.entitlements
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "2"
    CLANG_C_LANGUAGE_STANDARD: c11

targets:
  Henge:
    type: application
    platform: iOS
    sources:
      - path: Henge
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Henge.entitlements"
          - "Henge.personal.entitlements"
          - "AppIcon.icon/**"
          - "AppIcon.icon"
      - path: Henge/Resources
        buildPhase: resources
      # Icon Composer's document: the app icon, which iOS renders in Liquid Glass.
      - path: Henge/AppIcon.icon
        type: file
        buildPhase: resources
      # The messages the app and its JIT helper exchange.
      - path: HengeJITHelper/HengeJITMessages.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HENGE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Henge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Henge/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(HENGE_ENTITLEMENTS)
        SWIFT_OBJC_BRIDGING_HEADER: Henge/HengeBridge.h
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core"
          - "$(SRCROOT)/../host"
          - "$(SRCROOT)/../devices"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios"
          - "$(SRCROOT)/deps/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          # The engine (make ios-lib) and what its network needs (scripts/fetch_deps.sh).
          - "-lhengevm"
          # The installer (tools/build_ios_restore.sh): libirecovery, usbmuxd, idevicerestore and their libraries.
          - "-lhengerestore"
          - "-lz"
          - "-lslirp"
          - "-lglib-2.0"
          - "-lintl"
          - "-lpcre2-8"
          - "-liconv"
          - "-lresolv"
          # On-device pairing for Built-in StikJIT (from Husk's src/rppairing-ios).
          - "-lhusk_rppairing"
          - "-framework"
          - "Metal"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFAudio"
          - "-framework"
          - "CoreFoundation"
    preBuildScripts:
      - name: Build the engine
        script: |
          set -e
          cd "$SRCROOT/.."
          make ios-lib build/henge-agent.gz
          ./tools/build_ios_restore.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle the Mac helper
        # What runs inside macOS for the clipboard and shared folder (tools/henge-agent.m).
        script: |
          set -e
          cp "$SRCROOT/../build/henge-agent.gz" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/henge-agent.gz"
        basedOnDependencyAnalysis: false
