name: Build Henge IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Henge for iOS
    runs-on: macos-15

    steps:
      - name: Checkout Henge
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: main
          path: Husk
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install meson ninja pkg-config python3 xcodegen qemu

      - name: Verify QEMU
        run: |
          qemu-img --version
          which qemu-img

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Prepare libffi source
        run: |
          mkdir -p Husk/third_party/sources

          curl -fL --retry 5 \
            https://github.com/libffi/libffi/releases/download/v3.5.0/libffi-3.5.0.tar.gz \
            -o Husk/third_party/sources/libffi-3.5.0.tar.gz

          test -s Husk/third_party/sources/libffi-3.5.0.tar.gz

          tar -tzf Husk/third_party/sources/libffi-3.5.0.tar.gz > /dev/null

      - name: Build Husk
        working-directory: Husk
        run: |
          bash scripts/ci_build.sh

      - name: Configure HUSK
        run: |
          echo "HUSK=$GITHUB_WORKSPACE/Husk" >> "$GITHUB_ENV"

      - name: Verify Husk libraries
        run: |
          test -f Husk/build/ios-arm64/lib/libhusk_rppairing.a
          test -f Husk/build/ios-arm64/sysroot/lib/libslirp.a

      - name: Fetch Henge dependencies
        run: |
          bash ios/scripts/fetch_deps.sh

      - name: Build restore components
        run: |
          bash tools/build_ios_restore.sh

      - name: Build iOS libraries
        run: |
          make ios-lib

      - name: Package IPA
        run: |
          bash ios/scripts/package_ipa.sh

      - name: Prepare IPA
        run: |
          cp "$HOME/Desktop/Henge.ipa" "$GITHUB_WORKSPACE/Henge.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Henge-IPA
          path: Henge.ipa
          if-no-files-found: error
          retention-days: 7
