name: Build Henge IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Henge for iOS
    runs-on: macos-15

    steps:
      - name: Checkout Henge
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: main
          path: Husk
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install meson ninja pkg-config python3 xcodegen qemu gnu-tar

      - name: Configure GNU Tar
        run: |
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Prepare libffi source
        run: |
          mkdir -p Husk/third_party/sources

          curl -fL --retry 5 --retry-delay 5 \
            https://github.com/libffi/libffi/releases/download/v3.5.0/libffi-3.5.0.tar.gz \
            -o Husk/third_party/sources/libffi-3.5.0.tar.gz

          test -s Husk/third_party/sources/libffi-3.5.0.tar.gz
          tar -tzf Husk/third_party/sources/libffi-3.5.0.tar.gz > /dev/null

      - name: Fix ANGLE compiler warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Husk/scripts/build_angle_ios.sh")
          source = path.read_text()

          old = """OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-unguarded-availability-new'"""

          new = """OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-unguarded-availability-new -Wno-error=thread-safety-attributes -Wno-error=thread-safety-analysis'"""

          if old not in source:
              raise SystemExit("Could not find ANGLE compiler flags")

          path.write_text(source.replace(old, new, 1))
          print("ANGLE compiler flags patched successfully")
          PY

      - name: Build Husk
        working-directory: Husk
        run: |
          bash scripts/ci_build.sh

      - name: Configure HUSK
        run: |
          echo "HUSK=$GITHUB_WORKSPACE/Husk" >> "$GITHUB_ENV"

      - name: Verify Husk libraries
        run: |
          test -f Husk/build/ios-arm64/lib/libhusk_rppairing.a
          test -f Husk/build/ios-arm64/sysroot/lib/libslirp.a
          echo "Husk libraries verified"

      - name: Fetch Henge dependencies
        run: |
          bash ios/scripts/fetch_deps.sh

      - name: Build restore components
        run: |
          bash tools/build_ios_restore.sh

      - name: Build iOS libraries
        run: |
          make ios-lib

      - name: Package IPA
        run: |
          bash ios/scripts/package_ipa.sh

      - name: Prepare IPA
        run: |
          cp "$HOME/Desktop/Henge.ipa" "$GITHUB_WORKSPACE/Henge.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Henge-IPA
          path: Henge.ipa
          if-no-files-found: error
          retention-days: 7
